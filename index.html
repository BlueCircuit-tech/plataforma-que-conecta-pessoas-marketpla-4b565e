  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Libre Franklin', system-ui, sans-serif;
      background: #0F172A;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Scrollbar discreta ---- */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #A9C3EF; border-radius: 8px; }

    /* ---- Foco visível ---- */
    :focus-visible {
      outline: 2px solid #2563EB;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---- Transição de entrada de telas ---- */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [data-tela] {
      animation: fadeSlideIn 0.28s ease-out both;
    }

    /* ---- Navegação ativa ---- */
    [data-nav].ativo {
      color: #2563EB;
      position: relative;
    }
    [data-nav].ativo::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: #2563EB;
      border-radius: 0 0 4px 4px;
    }
    [data-nav]:not(.ativo) {
      color: #94A3B8;
    }
    [data-nav]:active {
      opacity: 0.65;
      transform: scale(0.93);
      transition: transform 0.12s ease;
    }

    /* ---- Utilitários reutilizáveis ---- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1.6;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(30,58,95,0.06), 0 0 0 1px rgba(30,58,95,0.04);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .card:active {
      transform: scale(0.985);
      box-shadow: 0 0 0 1px rgba(30,58,95,0.04);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Libre Franklin', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.9375rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: #2563EB;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }
    .btn-primary:hover { background: #1D4FA8; }
    .btn-secondary {
      background: #EEF3FB;
      color: #1E3A5F;
    }
    .btn-secondary:hover { background: #D4E1F7; }
    .btn-outline {
      background: transparent;
      color: #2563EB;
      border: 1.5px solid #2563EB;
    }
    .btn-outline:hover { background: #EEF3FB; }

    /* ---- Moldura do celular em desktop ---- */
    @media (min-width: 431px) {
      .phone-frame {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 20px;
      }
      .phone-body {
        width: 390px;
        height: 844px;
        border-radius: 36px;
        border: 4px solid #1E3A5F;
        overflow: hidden;
        position: relative;
        box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 2px #0F2861;
      }
    }
    @media (max-width: 430px) {
      .phone-frame { height: 100vh; }
      .phone-body {
        width: 100%;
        height: 100%;
        border-radius: 0;
        border: none;
        overflow: hidden;
        position: relative;
      }
      .phone-body .status-bar { display: none; }
    }
  </style>
</head>

            '<h3 class="font-display font-bold text-sm text-marca-900 truncate">' + i.titulo + '</h3>' +
            '<span class="text-xs px-1.5 py-0.5 rounded border ' + c.cor + ' ' + c.texto + ' font-semibold whitespace-nowrap flex-shrink-0">' + c.label + '</span></div>' +
            '<p class="text-xs text-gray-400 mt-0.5 truncate">' + i.endereco + '</p>' +
            '<div class="flex items-baseline justify-between mt-1.5">' +
            '<span class="font-display font-bold text-sm text-marca-800">' + brl(i.preco) + '</span>' +
            '<span class="text-xs text-gray-400">' + i.condicao + '</span></div>' +
            (i.quartos > 0 ? '<div class="flex gap-2 mt-1">' + '<span class="text-xs text-gray-500">' + i.quartos + ' quarto(s)</span>' + (i.area > 0 ? '<span class="text-xs text-gray-400">·</span><span class="text-xs text-gray-500">' + i.area + 'm²</span>' : '') + '</div>' : '<div class="text-xs text-gray-500 mt-1">' + i.area + 'm²</div>') +
            '</div></div>';
        }).join('');
      }

      function mapa_de_imoveis_geolocalizar() {
        const btn = event.currentTarget;
        btn.classList.add('animate-spin');
        btn.querySelector('svg').innerHTML = '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="32" stroke-linecap="round" class="text-marca-200"/><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="24 48" stroke-linecap="round" class="text-marca-600"/>';
        setTimeout(() => {
          btn.classList.remove('animate-spin');
          btn.querySelector('svg').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>';
          toast('Localização atualizada com sucesso','ok');
        }, 1500);
      }

      function mapa_de_imoveis_zoomIn() {
        if (mapa_estado.zoom < 2.5) {
          mapa_estado.zoom += 0.3;
          document.getElementById('mapa-mundo').style.transform = 'scale(' + mapa_estado.zoom + ')';
        } else { toast('Zoom máximo atingido','info'); }
      }

      function mapa_de_imoveis_zoomOut() {
        if (mapa_estado.zoom > 0.5) {
          mapa_estado.zoom -= 0.3;
          document.getElementById('mapa-mundo').style.transform = 'scale(' + mapa_estado.zoom + ')';
        } else { toast('Zoom mínimo atingido','info'); }
      }

      function mapa_de_imoveis_buscar(termo) {
        if (!termo || termo.length < 2) { mapa_de_imoveis_atualizarContagem(); return; }
        const t = termo.toLowerCase();
        const filtrados = imoveis_data.filter(i => i.titulo.toLowerCase().includes(t) || i.endereco.toLowerCase().includes(t) || i.tipo.toLowerCase().includes(t) || i.proprietario.toLowerCase().includes(t));
        mapa_de_imoveis_atualizarContagem(filtrados.length);
        if (filtrados.length === 0) { toast('Nenhum imóvel encontrado para "' + termo + '"','info'); }
        else { toast(filtrados.length + ' imóvel(is) encontrado(s)','ok'); }
      }

      function mapa_de_imoveis_atualizarContagem(qtd) {
        const total = qtd !== undefined ? qtd : imoveis_data.length;
        document.getElementById('contagem-imoveis').textContent = total + ' imóvel(is) no mapa';
      }

      setTimeout(mapa_de_imoveis_init, 100);
    </script>

  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] flex flex-col items-center gap-2 pointer-events-none" style="max-width:360px;width:92%"></div>

  <!-- ========== MODAL GENÉRICO ========== -->
  <div id="modal-overlay" class="fixed inset-0 z-[9998] bg-black/50 hidden items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm" role="dialog" aria-modal="true">
    <div id="modal-card" class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md max-h-[80vh] flex flex-col shadow-elevated">
      <div class="flex items-center justify-between px-5 pt-5 pb-3 border-b border-marca-100">
        <h3 id="modal-title" class="font-display text-lg text-marca-900"></h3>
        <button onclick="fecharModal()" class="p-1.5 rounded-full hover:bg-marca-50 transition-colors" aria-label="Fechar modal">
          <svg class="w-5 h-5 text-marca-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="flex-1 overflow-y-auto p-5"></div>
    </div>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <script>
    /* ========== RELÓGIO ========== */
    function atualizarRelogio() {
      var agora = new Date();
      var h = String(agora.getHours()).padStart(2, '0');
      var m = String(agora.getMinutes()).padStart(2, '0');
      var el = document.getElementById('relogio');
      if (el) el.textContent = h + ':' + m;
    }
    atualizarRelogio();
    setInterval(atualizarRelogio, 30000);

    /* ========== ROTEADOR ========== */
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('mapa-de-imoveis');
    });

    /* ========== TOASTS ========== */
    function toast(mensagem, tipo) {
      tipo = tipo || 'info';
      var container = document.getElementById('toast-container');
      var cores = { ok: 'bg-emerald-600', erro: 'bg-red-600', info: 'bg-marca-900' };
      var icones = {
        ok:    '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>',
        erro:  '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>',
        info:  '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>',
      };
      var el = document.createElement('div');
      el.className = 'pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white text-sm font-medium shadow-elevated ' + (cores[tipo] || cores.info);
      el.innerHTML = (icones[tipo] || icones.info) + '<span>' + mensagem + '</span>';
      el.style.opacity = '0';
      el.style.transform = 'translateY(-12px)';
      el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      container.appendChild(el);
      requestAnimationFrame(function () {
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      });
      setTimeout(function () {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-12px)';
        setTimeout(function () { el.remove(); }, 300);
      }, 3000);
    }

    /* ========== MODAL ========== */
    function abrirModal(html, titulo) {
      var overlay = document.getElementById('modal-overlay');
      var title   = document.getElementById('modal-title');
      var body    = document.getElementById('modal-body');
      title.textContent = titulo || '';
      body.innerHTML = html;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }
    function fecharModal() {
      var overlay = document.getElementById('modal-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }
    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target === this) fecharModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') fecharModal();
    });

    /* ========== FORMATAÇÃO ========== */
    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T00:00:00');
      var dia = String(d.getDate()).padStart(2, '0');
      var mes = String(d.getMonth() + 1).padStart(2, '0');
      var ano = d.getFullYear();
      return dia + '/' + mes + '/' + ano;
    }

    /* ========== AVATAR COM INICIAIS ========== */
    function avatar(iniciais, cor) {
      cor = cor || '#2563EB';
      return '<div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-semibold flex-shrink-0" style="background:' + cor + '">' + iniciais + '</div>';
    }

    /* ========== LOGO SVG ========== */
    function logoAlphaMon(tamanho) {
      tamanho = tamanho || 28;
      var s = '<svg width="' + tamanho + '" height="' + tamanho + '" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">';
      s += '<rect width="32" height="32" rx="8" fill="#1E3A5F"/>';
      s += '<path d="M9 24V12L16 6L23 12V24" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
      s += '<path d="M12 24V16L16 13L20 16V24" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
      s += '<path d="M6 24H26" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>';
      s += '<circle cx="16" cy="18" r="2.5" fill="white"/>';
      s += '</svg>';
      return s;
    }
  </script>
